name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn verify -B

  javadoc:
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/javadoc.yml
    permissions:
      contents: write
    with:
      deploy-dir: main
    secrets: inherit
