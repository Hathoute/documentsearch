name: Javadoc

on:
  workflow_call:
    inputs:
      deploy-dir:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      deploy-dir:
        required: true
        type: string
        default: main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set Maven version for release
        if: startsWith(inputs.deploy-dir, 'v')
        shell: bash
        run: |
          MVN_VER="${{ inputs.deploy-dir }}"
          MVN_VER="${MVN_VER#v}"
          mvn versions:set -DnewVersion="$MVN_VER" -q

      - name: Generate Javadoc
        run: mvn javadoc:javadoc -B -q

      - name: Checkout gh-pages branch
        shell: bash
        run: |
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages 2>/dev/null || {
            mkdir gh-pages
            cd gh-pages
            git init -b gh-pages
            git remote add origin \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
          }

      - name: Deploy javadoc and build versions.json
        shell: bash
        run: |
          DIR="${{ inputs.deploy-dir }}"
          rm -rf "gh-pages/$DIR"
          mkdir -p "gh-pages/$DIR"
          cp -r target/reports/apidocs/* "gh-pages/$DIR/"

          cd gh-pages
          json="["
          first=true
          for d in */; do
            d="${d%/}"
            [ "$d" = "index.html" ] && continue
            [ "$d" = "versions.json" ] && continue
            [ -f "$d" ] && continue
            desc=""
            if [ "$d" = "main" ]; then
              desc="latest development build"
            else
              desc="stable release"
            fi
            if [ "$first" = true ]; then
              first=false
            else
              json+=","
            fi
            json+='{"path":"'"$d"'","label":"'"$d"'","description":"'"$desc"'"}'
          done
          json+="]"
          echo "$json" > versions.json
          cd ..

          cp gh-pages-index.html gh-pages/index.html

      - name: Commit and push gh-pages
        shell: bash
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update javadoc for ${{ inputs.deploy-dir }}"
          git push origin HEAD:gh-pages
