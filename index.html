<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open-elastic Javadoc</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: #1a1a2e;
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    header p { font-size: 0.95rem; opacity: 0.8; }
    main {
      flex: 1;
      padding: 2rem 1rem;
      max-width: 640px;
      width: 100%;
    }
    .version-list { list-style: none; }
    .version-list li {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      transition: box-shadow 0.2s;
    }
    .version-list li:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .version-list a {
      display: block;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: #1a1a2e;
      font-weight: 500;
    }
    .version-list .meta {
      font-weight: 400;
      font-size: 0.85rem;
      color: #777;
      margin-top: 0.2rem;
    }
    footer {
      padding: 1.5rem;
      font-size: 0.85rem;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>documentsearch Javadoc</h1>
    <p>API documentation for the documentsearch library</p>
  </header>
  <main>
    <ul class="version-list" id="versions">
      <li><a href="./main/">main <span class="meta">latest development build</span></a></li>
    </ul>
  </main>
  <footer>
    <a href="https://github.com/hathoute/documentsearch">GitHub</a>
  </footer>
</body>
</html>
